<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mycar QR — красивые QR-коды</title>
<meta name="description" content="Генератор фирменных QR-кодов Mycar и Autocheck: ссылка, Wi-Fi, контакт, e-mail. Скачивание в SVG и PNG.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  try { var t = localStorage.getItem('mq-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <span>
      <span class="brand-name">Mycar QR</span>
      <span class="brand-sub" data-i18n="tagline"></span>
    </span>
  </a>
  <div class="top-actions">
    <div class="seg seg-sm" id="langSeg" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button type="button" class="icon-btn" id="themeBtn" data-i18n-aria="theme" aria-label="Theme">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <div class="col">
    <section class="card">
      <h2 data-i18n="content"></h2>
      <label class="field"><span data-i18n="contentLabel"></span><input type="text" id="content" autocomplete="off" spellcheck="false" placeholder="https://mycar.kz"></label>
    </section>

    <section class="card">
      <h2 data-i18n="style"></h2>

      <div class="group">
        <div class="label" data-i18n="presets"></div>
        <div class="chips" id="presetChips"></div>
      </div>

      <div class="group">
        <div class="label" data-i18n="logo"></div>
        <div class="seg" id="logoSeg" role="group"></div>
      </div>

      <div id="logoScaleSlider" class="group"></div>

      <div class="group">
        <div class="label" data-i18n="modules"></div>
        <div class="icon-chips" id="dotChips"></div>
      </div>
      <div id="scaleSlider" class="group"></div>
      <div class="row2">
        <div class="group">
          <div class="label" data-i18n="markerOutline"></div>
          <div class="icon-chips" id="cornerSqChips"></div>
        </div>
        <div class="group">
          <div class="label" data-i18n="markerCore"></div>
          <div class="icon-chips" id="cornerDotChips"></div>
        </div>
      </div>

      <div class="colors" id="colorRow">
        <label class="color-field"><span data-i18n="color"></span><span class="color-input"><input type="color" id="c1"><input type="text" id="c1t" maxlength="7" spellcheck="false"></span></label>
        <label class="color-field"><span data-i18n="background"></span><span class="color-input"><input type="color" id="bg"><input type="text" id="bgt" maxlength="7" spellcheck="false"></span></label>
      </div>
      <div id="bgRadiusSlider" class="group"></div>
      <label class="toggle-row"><input type="checkbox" id="transparent" class="toggle"><span data-i18n="transparent"></span></label>
      <label class="toggle-row"><input type="checkbox" id="markersSame" class="toggle" checked><span data-i18n="markersSame"></span></label>
      <div class="colors" id="markerColors" hidden>
        <label class="color-field"><span data-i18n="markerOutline"></span><span class="color-input"><input type="color" id="m1"><input type="text" id="m1t" maxlength="7" spellcheck="false"></span></label>
        <label class="color-field"><span data-i18n="markerCore"></span><span class="color-input"><input type="color" id="m2"><input type="text" id="m2t" maxlength="7" spellcheck="false"></span></label>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="params"></h2>
      <div class="row2">
        <div class="group">
          <div class="label" data-i18n="pngSize"></div>
          <div class="seg" id="sizeSeg" role="group"></div>
        </div>
        <div class="group">
          <div class="label" data-i18n="quiet"></div>
          <div class="seg" id="quietSeg" role="group"></div>
        </div>
      </div>
      <div class="group">
        <div class="label" data-i18n="ec"></div>
        <div class="seg" id="ecSeg" role="group"></div>
        <p class="hint" id="ecHint"></p>
      </div>
    </section>
  </div>

  <aside class="col preview-col">
    <section class="card preview-card">
      <div class="preview" id="preview" aria-live="polite"></div>
      <div class="warn" id="warn" role="status" hidden></div>
      <div class="payload">
        <div class="label" data-i18n="payload"></div>
        <pre id="payloadText"></pre>
      </div>
      <div class="actions">
        <div class="toast-slot" id="toast" aria-live="polite"></div>
        <button type="button" class="btn btn-primary" id="dlPng" data-i18n="downloadPng"></button>
        <button type="button" class="btn btn-secondary" id="dlSvg" data-i18n="downloadSvg"></button>
        <button type="button" class="btn btn-ghost" id="copyPng" data-i18n="copyPng"></button>
        <button type="button" class="btn btn-ghost" id="copySvg" data-i18n="copySvg"></button>
      </div>
    </section>
  </aside>
</main>

<footer class="foot"><span data-i18n="footer"></span></footer>
<script src="app.js"></script>
</body>
</html>
